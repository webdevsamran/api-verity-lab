openapi: 3.1.0
info:
  title: Verity CRUD API (fixture)
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8090
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: user list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserInput"}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: one user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "404": {description: not found}
    delete:
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: deleted}
components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1}
        email: {type: string, format: email}
        age: {type: integer, minimum: 0, maximum: 150}
        role: {type: string, enum: [admin, user, guest]}
    UserInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        email: {type: string, format: email}
        age: {type: integer, minimum: 0, maximum: 150}
        role: {type: string, enum: [admin, user, guest]}