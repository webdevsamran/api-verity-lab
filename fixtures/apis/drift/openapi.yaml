openapi: 3.1.0
info:
  title: Verity Drift-Prone API (fixture)
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: user profile
          headers:
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [id, name, email]
                properties:
                  id: {type: string}
                  name: {type: string}
                  # Classified, because it is one. Without the annotation
                  # `DRIFT-RESPONSE-PII` reports it every run, and it is
                  # right to: an email arriving at a field the contract
                  # does not say carries one is the mismatch that rule is
                  # about.
                  email:
                    type: string
                    x-data-classification: pii
                  plan: {type: string, enum: [free, pro]}
  /reports:
    get:
      operationId: getReports
      responses:
        "200":
          description: report list
          content:
            application/json:
              schema:
                type: array
                items: {type: string}