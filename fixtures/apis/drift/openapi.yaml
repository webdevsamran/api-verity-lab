openapi: 3.1.0
info:
  title: Verity Drift-Prone API (fixture)
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: user profile
          headers:
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [id, name, email]
                properties:
                  id: {type: string}
                  name: {type: string}
                  email: {type: string}
                  plan: {type: string, enum: [free, pro]}
  /reports:
    get:
      operationId: getReports
      responses:
        "200":
          description: report list
          content:
            application/json:
              schema:
                type: array
                items: {type: string}