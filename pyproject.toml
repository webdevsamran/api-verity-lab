[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "api-verity-lab"
version = "0.2.0"
description = "Unified API contract governance, breaking-change analysis, schema-driven testing, runtime drift detection, traffic replay and performance regression for OpenAPI, GraphQL and gRPC."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "@webdevsamran" }]
keywords = [
  "openapi", "graphql", "grpc", "contract-testing", "breaking-changes",
  "api-diff", "fuzzing", "drift-detection", "traffic-replay",
  "performance-regression", "semver", "api-governance",
  "mcp", "model-context-protocol", "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

dependencies = [
  "httpx>=0.27,<1.0",
  "flask>=3.0,<4.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "packaging>=24.0,<27.0",
]

[project.optional-dependencies]
graphql = ["graphql-core>=3.2,<4.0"]
grpc = ["grpcio-tools>=1.62,<2.0"]
dev = [
  # The graphql extra is a dev dependency too: without it every GraphQL test
  # skips, and a suite that silently skips its coverage of a feature is
  # indistinguishable from one that passes it.
  "graphql-core>=3.2,<4.0",
  "pytest>=8.2,<10.0",
  "pytest-cov>=5.0,<8.0",
  "pytest-asyncio>=0.23,<2.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<3.0",
  "types-PyYAML",
  "pre-commit>=3.7,<5.0",
  "build>=1.2,<2.0",
]

[project.scripts]
apiverity = "apiverity.cli.main:main"
# No extra required: the framing is newline-delimited JSON-RPC over stdio,
# which needs nothing the package does not already have.
apiverity-mcp = "apiverity.mcp.server:main"

[project.entry-points."apiverity.specs"]
openapi = "apiverity.specs.openapi:OpenApiSpecPlugin"
graphql = "apiverity.specs.graphql:GraphQlSpecPlugin"
grpc = "apiverity.specs.grpc:GrpcSpecPlugin"
asyncapi = "apiverity.specs.asyncapi:AsyncApiSpecPlugin"
mcp = "apiverity.specs.mcp:McpSpecPlugin"

[project.entry-points."apiverity.rules"]
core = "apiverity.plugins.builtins:core_rules"

[project.entry-points."apiverity.checks"]
security = "apiverity.plugins.builtins:security_checks"

[project.entry-points."apiverity.generators"]
schema-cases = "apiverity.plugins.builtins:schema_case_generator"
unicode = "apiverity.fuzz.generators:UnicodeGenerator"
nesting = "apiverity.fuzz.generators:NestingGenerator"
numeric = "apiverity.fuzz.generators:NumericBoundaryGenerator"
header-safety = "apiverity.fuzz.generators:HeaderSafetyGenerator"

[project.entry-points."apiverity.exporters"]
reports = "apiverity.plugins.builtins:report_exporters"

[project.entry-points."apiverity.transports"]
httpx = "apiverity.plugins.builtins:httpx_transport"

[project.urls]
Homepage = "https://github.com/webdevsamran/api-verity-lab"
Repository = "https://github.com/webdevsamran/api-verity-lab"
Issues = "https://github.com/webdevsamran/api-verity-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["apiverity"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
# Kept at 3.12 deliberately: some shipped stubs (httpx chain) use PEP 695
# syntax that cannot be parsed when targeting 3.11.
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["graphql", "graphql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: end-to-end fixture integration tests",
  "property: hypothesis property-based tests",
]

[tool.coverage.run]
source = ["apiverity"]
branch = true

[tool.coverage.report]
# Matches the --cov-fail-under=72 that CI passes on the command line. Without
# it, a local `pytest --cov` enforced nothing, so tests/README.md's claim that
# CI runs "the same suite" was true of the tests but not of the gate.
fail_under = 72
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff.lint.per-file-ignores]
"scripts/check_docs_site.py" = ["S603", "RUF100"]
# Same shared-script situation: the gh endpoint is built from the hardcoded
# REPOS list above it, not from user input.
"scripts/fetch_competitor_meta.py" = ["S603", "S607", "RUF100"]
# Shared verbatim across the four sibling repositories, whose ruff rule
# sets differ: S310 must be suppressed where it is enabled, and that
# suppression must not read as unused (RUF100) where it is not.
"scripts/check_action_pins.py" = ["S310", "RUF100"]
