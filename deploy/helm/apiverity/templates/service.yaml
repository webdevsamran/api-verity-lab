apiVersion: v1
kind: Service
metadata:
  name: {{ include "apiverity.fullname" . }}
  labels:
    {{- include "apiverity.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "apiverity.selectorLabels" . | nindent 4 }}
