site_name: api-verity-lab
site_description: >
  API contract governance in one tool: breaking-change rules, runtime drift
  detection, schema-driven fuzzing, traffic replay and performance budgets for
  OpenAPI, Swagger 2.0, AsyncAPI, GraphQL, gRPC, MCP tool manifests and WSDL.
site_url: https://webdevsamran.github.io/api-verity-lab/
repo_url: https://github.com/webdevsamran/api-verity-lab
repo_name: webdevsamran/api-verity-lab

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
  icon:
    logo: material/check-decagram

