version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dev:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-dev:
        dependency-type: "development"
    ignore:
      # TypeScript 7 is not installable here yet: typescript-eslint declares
      # `peer typescript@">=4.8.4 <6.1.0"`, and 8.69.0 is its latest release,
      # so `npm ci` fails with ERESOLVE before anything compiles. Dependabot
      # reopened this bump immediately after it was declined (#33, #38), and
      # will keep doing so weekly. Remove this entry once a typescript-eslint
      # release supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init, /autobuild and /analyze MUST move together.
      # Ungrouped, Dependabot opens one PR per sub-action, so each PR leaves
      # the trio version-skewed and the analysis fails with:
      #   "Loaded a configuration file for version 'X', but running version 'Y'"
      # That is what stalled #28, #30 and #31.
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
