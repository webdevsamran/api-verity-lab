name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both needed by the attestation steps below: `id-token` for the OIDC
      # exchange with Sigstore, `attestations` to record the result against
      # this repository. Requested here rather than at the workflow level so
      # every other job keeps the read-only default.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install --upgrade pip && pip install build
      - name: Build distributions
        run: python -m build
      - name: Check metadata consistency
        run: |
          pip install twine
          twine check dist/*
      # An SBOM produced from the same tree that produced the artifacts, in
      # the same job. The `sbom` job in ci.yml scans `main` on every push,
      # which answers a different question: what is in the branch, not what is
      # in this release.
      - name: Generate SBOM for this release
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: dist/api-verity-lab.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Checksums that travel with the release rather than being recomputed by
      # whoever downloads it. `SHA256SUMS` is the file `sha256sum -c` reads.
      - name: Checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS
      # SLSA provenance: a signed statement of which workflow, at which commit,
      # produced these exact bytes. Sigstore-backed through the OIDC token
      # above, so there is no key for anyone to lose or leak.
      #
      # Verify a downloaded artifact with:
      #     gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
          sbom-path: dist/api-verity-lab.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/api-verity-lab
    permissions:
      id-token: write # OIDC trusted publishing — no API token stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      # `twine` uploads every file in the directory, and the SBOM and the
      # checksum file are not distributions -- it rejects them and the upload
      # fails with the release already tagged.
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS dist/api-verity-lab.spdx.json
      # Guarded rather than unconditional. Publishing needs a Trusted
      # Publisher registered for this project on pypi.org, which cannot be
      # created from a repository -- it is a form on the PyPI account that
      # owns the name. Without the guard a tagged release fails here even
      # though the build, the GitHub Release and the image all succeeded, and
      # a red release is indistinguishable from a broken one.
      - name: Is Trusted Publishing configured?
        id: guard
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          if [ "${PUBLISH_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PyPI upload: set the repository variable PUBLISH_ENABLED=true after registering a Trusted Publisher (owner webdevsamran, repo api-verity-lab, workflow release.yml, environment pypi)."
          fi
      - name: Publish
        if: steps.guard.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release create` shells out to git for the repository context.
      # Without a checkout it fails with "fatal: not a git repository" -- which
      # is exactly what happened on the first tag local-ai-hardware-bench ever
      # pushed: build, SBOM and checksums all succeeded and no release was
      # created. This job needs no source, only the repo, but it does need
      # that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "api-verity-lab $TAG" \
            --generate-notes

  docker-image:
    name: Build & push server image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Attested by digest, not by tag: a tag can be moved to different bytes
      # and the attestation would then describe an image nobody is running.
      #
      # Verify with:
      #     gh attestation verify oci://ghcr.io/<owner>/<repo>-server:<tag> \
      #       --repo <owner>/<repo>
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
