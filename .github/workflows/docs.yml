name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      # The theme override writes the Open Graph, Twitter card and
      # structured-data tags. Left out of this list, a change to it would
      # never redeploy, and the site would go on serving the old head.
      - 'overrides/**'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      # The playground runs a wheel built from this tree. Without these, a
      # code change would publish a page running whatever the source was the
      # last time a markdown file happened to change.
      - 'apiverity/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      # The theme override writes the Open Graph, Twitter card and
      # structured-data tags. Left out of this list, a change to it would
      # never redeploy, and the site would go on serving the old head.
      - 'overrides/**'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      # The playground runs a wheel built from this tree. Without these, a
      # code change would publish a page running whatever the source was the
      # last time a markdown file happened to change.
      - 'apiverity/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt
      # The playground installs this wheel in the reader's browser under
      # Pyodide, so it has to be the tree being published and not the last
      # release. Built before mkdocs runs, because mkdocs is what copies
      # `docs/` into the site.
      - name: Build the wheel the playground runs
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python scripts/generate_playground.py --check
          cp dist/*.whl docs/playground/
      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir site
      - name: The playground's wheel reached the site
        # A missing wheel is a 404 the page can only report after thirty
        # seconds of loading Python, which reads as the page being broken.
        run: |
          test -n "$(ls site/playground/*.whl 2>/dev/null)" \
            || { echo "no wheel in site/playground"; exit 1; }
      - name: Docs site actually contains its documents
        # A green mkdocs build does not mean the pages have anything in them.
        # devrepro-doctor published empty pages for months because every
        # snippet include silently resolved to nothing.
        run: python scripts/check_docs_site.py --site site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Deploy docs
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
