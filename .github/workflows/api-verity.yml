name: API Verity — contract gate

# Reusable PR experience: validate the changed contract, diff against the
# base branch, gate on breaking changes + semver, and publish ONE concise
# summary comment (updated on push, never spammed).

on:
  workflow_call:
    inputs:
      spec-path:
        description: Path to the OpenAPI contract
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Locate contracts changed in this PR
        id: specs
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          SPECS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '\.(yaml|yml|json)$' \
            | grep -Eiv 'package|lock|\.github' || true)
          echo "specs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SPECS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed specs:"; echo "$SPECS"

      - name: Validate + diff + breaking gate per contract
        id: gate
        env:
          SPECS: ${{ steps.specs.outputs.specs }}
        run: |
          set -o pipefail
          OVERALL=0
          mkdir -p .apiverity-artifacts
          for spec in $SPECS; do
            [ -f "$spec" ] || continue
            BASE="origin/${{ github.base_ref }}:$spec"
            git show "$BASE" > /tmp/base-spec 2>/dev/null || BASE=""

            echo "::group::validate $spec"
            apiverity validate "$spec" || OVERALL=1
            echo "::endgroup::"

            if [ -n "$BASE" ]; then
              echo "::group::breaking $spec"
              apiverity breaking /tmp/base-spec "$spec" --check-semver --json \
                > ".apiverity-artifacts/$(echo "$spec" | tr '/' '_').json" \
                || OVERALL=1
              echo "::endgroup::"
            fi
          done
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          exit 0   # the gate step below reports status; keep artifacts

      - name: Build one concise PR summary
        if: always()
        run: python .github/scripts/pr_summary.py

      - name: Update PR comment (no spam)
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-summary.md', 'utf8');
            const marker = '<!-- api-verity-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            const payload = marker + String.fromCharCode(10) + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload,
              });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apiverity-results
          path: .apiverity-artifacts/

      - name: Enforce gate
        if: steps.gate.outputs.overall == '1'
        run: |
          echo "Breaking changes or validation errors detected — blocking merge."
          exit 1