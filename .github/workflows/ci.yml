name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check apiverity tests scripts
      - name: Ruff format check
        run: ruff format --check apiverity tests scripts
      - name: Type check
        run: mypy apiverity
      - name: Tests with coverage
        run: pytest tests/ -q --cov=apiverity --cov-report=term-missing --cov-fail-under=72
      - name: Build distribution
        run: python -m build
      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off
      - name: Fixture end-to-end validation
        run: python scripts/e2e.py
      - name: Rule catalog doc matches the code
        # The hand-maintained catalog documented six rule IDs the engine has
        # never had and omitted twenty-three it does, so an override copied
        # from the docs was silently ignored. Generated now; this catches drift.
        run: python scripts/generate_rule_catalog.py --check

      - name: README examples match a real run
        # The README showed hand-written CLI output where every identifier was
        # wrong: `CHG-OPERATION-REMOVED-1` against a code path that can only
        # emit `CHG-OPERATION_REMOVED-1`, and `DRIFT-FIELD` against the real
        # `DRIFT-MISSING-FIELD`. A reader who grepped for either found
        # nothing. The examples are captured from real runs now, and this step
        # fails if the committed README stops matching what the code produces.
        run: python scripts/capture_readme_examples.py --check

  # pyproject declares "Operating System :: OS Independent" and Python 3.11 and
  # 3.12, but CI ran ubuntu-latest on 3.12 only -- so a 3.11 user, or anyone on
  # Windows or macOS, was running wholly unvalidated code against a classifier
  # that said otherwise. This job tests what the package claims to support.
  #
  # Deliberately a separate job rather than a matrix on `python` above: turning
  # that one into a matrix would rename its check from
  # "Python lint · types · tests" to "Python lint · types · tests (ubuntu-latest,
  # 3.12)", and branch protection matches contexts byte-for-byte, so every open
  # pull request would hang on a check that can never report.
  #
  # Lint, format and mypy stay on the single job: they are properties of the
  # source, not of the interpreter running it, and mypy is pinned to 3.12 on
  # purpose (see the note in pyproject.toml).
  platform-matrix:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Covered by the `python` job above, with lint and types alongside.
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -q
      - name: Fixture end-to-end validation
        run: python scripts/e2e.py

  schema-validation:
    name: Result artifact schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml && pip install -e .
      - name: Validate bundled result artifacts against schemas/result-v1
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          schema = json.loads(pathlib.Path("schemas/result-v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          print("result-v1 schema is valid")
          PY

  frontend:
    name: Frontend lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Code splitting is invisible when it breaks: a static import of a page
      # module collapses every chunk back into the entry and nothing fails.
      - run: npm run check:bundle

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: api-verity-lab-sbom.spdx.json