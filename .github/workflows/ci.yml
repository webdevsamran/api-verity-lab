name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check apiverity tests scripts
      - name: Ruff format check
        run: ruff format --check apiverity tests scripts
      - name: Type check
        run: mypy apiverity
      - name: Tests with coverage
        run: pytest tests/ -q --cov=apiverity --cov-report=term-missing --cov-fail-under=60
      - name: Fixture end-to-end validation
        run: python scripts/e2e.py

  schema-validation:
    name: Result artifact schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml && pip install -e .
      - name: Validate bundled result artifacts against schemas/result-v1
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          schema = json.loads(pathlib.Path("schemas/result-v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          print("result-v1 schema is valid")
          PY

  frontend:
    name: Frontend lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: anchore/sbom-action@f325610c9f50a54cbdcab9f0e868d9b7fcc1f5bb # v0.17.9
        with:
          format: spdx-json
          artifact-name: api-verity-lab-sbom.spdx.json