name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check apiverity tests scripts .github/scripts
      - name: Ruff format check
        run: ruff format --check apiverity tests scripts .github/scripts
      - name: Type check
        run: mypy apiverity
      - name: Tests with coverage
        run: pytest tests/ -q --cov=apiverity --cov-report=term-missing --cov-fail-under=72
      - name: Build distribution
        run: python -m build
      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off
      - name: Fixture end-to-end validation
        run: python scripts/e2e.py
      - name: Rule catalog doc matches the code
        # The hand-maintained catalog documented six rule IDs the engine has
        # never had and omitted twenty-three it does, so an override copied
        # from the docs was silently ignored. Generated now; this catches drift.
        run: python scripts/generate_rule_catalog.py --check

      - name: Config schema matches the code
        # The validator and the published schema are built from one table in
        # apiverity/core/config.py. If they diverged, an editor would
        # autocomplete a key the tool rejects.
        run: python scripts/generate_config_schema.py --check

      - name: Capability manifest and llms.txt match the code
        # docs/llms.txt and docs/capabilities.json tell other people's tools
        # what this one can do. A hand-written capability list is a claim that
        # rots, and this is the last file to leave to memory.
        run: python scripts/generate_capability_manifest.py --check

      - name: Check-rule doc matches the catalogues
        # Every rule that is not a breaking-change rule. Twenty-two SEC-* ones
        # were reachable, documented nowhere and denied by `apiverity explain`;
        # the LIFECYCLE-* family joined the same table rather than starting a
        # second one. This keeps the published list from drifting away from the
        # rules that actually fire.
        run: python scripts/generate_check_rules.py --check

      - name: Rule parity matrix matches what the rules do
        # Derived by making every rule fire rather than written down: a matrix
        # asserting coverage nobody demonstrated is worse than no matrix,
        # because it is the kind of thing quoted in an evaluation.
        run: python scripts/generate_rule_parity.py --check

      - name: oasdiff migration table matches the mapping
        # The question a team switching from oasdiff has is "which of my jq
        # filters will stop matching". A hand-written answer to that goes stale
        # the first time somebody adds a rule, and a stale migration table is
        # worse than none: it promises a filter still works after it has
        # stopped.
        run: python scripts/generate_oasdiff_map.py --check

      - name: oasdiff benchmark doc matches its evidence
        # Rendered from data/benchmark-oasdiff.json, which a maintainer
        # regenerates with `--run` on a machine that has Go. CI has no Go
        # toolchain and should not grow one to render a document -- and a
        # benchmark that silently re-ran on every push would publish numbers
        # nobody looked at. Freshness is carried by the date in the evidence.
        run: python scripts/benchmark_oasdiff.py --check

      - name: Compliance mapping doc matches the code
        # The OWASP control -> rule mapping is published in
        # docs/compliance-mapping.md. A renamed rule would leave that table
        # promising coverage the code no longer has, silently.
        run: python scripts/generate_compliance_map.py --check

      - name: Competitive landscape matches the fetched data
        # README.md and docs/index.md both told the reader this table was
        # "rendered from committed API data" by "a checked-in script". There was
        # no such script and no such step: the table was typed by hand, which is
        # how it came to publish "Optic -- repo gone (404)" about a project that
        # is archived and public. Rendered now, and this is the step that makes
        # the claim true. It checks the doc against the committed evidence, not
        # against GitHub -- fetching needs `gh` auth, so freshness is carried by
        # the date the data records, never by this step.
        run: python scripts/generate_competitive_table.py --check

      - name: README examples match a real run
        # The README showed hand-written CLI output where every identifier was
        # wrong: `CHG-OPERATION-REMOVED-1` against a code path that can only
        # emit `CHG-OPERATION_REMOVED-1`, and `DRIFT-FIELD` against the real
        # `DRIFT-MISSING-FIELD`. A reader who grepped for either found
        # nothing. The examples are captured from real runs now, and this step
        # fails if the committed README stops matching what the code produces.
        run: python scripts/capture_readme_examples.py --check

      - name: Secret scan
        # The only secret check here was a local pre-commit `detect-private-key`
        # hook, which `git commit --no-verify` skips and CI never ran. This is
        # the scanner tooltrace-bench uses, plus the Slack, Google, Stripe and
        # npm rules a planted-secret test showed it was missing.
        run: python scripts/secret_scan.py

  # pyproject declares "Operating System :: OS Independent" and Python 3.11 and
  # 3.12, but CI ran ubuntu-latest on 3.12 only -- so a 3.11 user, or anyone on
  # Windows or macOS, was running wholly unvalidated code against a classifier
  # that said otherwise. This job tests what the package claims to support.
  #
  # Deliberately a separate job rather than a matrix on `python` above: turning
  # that one into a matrix would rename its check from
  # "Python lint · types · tests" to "Python lint · types · tests (ubuntu-latest,
  # 3.12)", and branch protection matches contexts byte-for-byte, so every open
  # pull request would hang on a check that can never report.
  #
  # Lint, format and mypy stay on the single job: they are properties of the
  # source, not of the interpreter running it, and mypy is pinned to 3.12 on
  # purpose (see the note in pyproject.toml).
  platform-matrix:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Covered by the `python` job above, with lint and types alongside.
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -q
      - name: Fixture end-to-end validation
        run: python scripts/e2e.py

  schema-validation:
    name: Result artifact schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml && pip install -e .
      - name: Validate bundled result artifacts against schemas/result-v1
        # This step used to load the schema, call `check_schema` on it, and
        # print "result-v1 schema is valid". That validates the schema
        # *document*; it never loaded an artifact. It was green, required and
        # branch-protected while proving nothing about its own name.
        #
        # Running it for real immediately found five disagreements between the
        # schema and the emitters, including `changes` and `operations` each
        # carrying an integer in one command and an array in another.
        run: python scripts/validate_result_artifacts.py
      - name: Pinned actions match their version comments
        # Five `uses:` lines pinned setup-python@5fda3b95a4ea and called it
        # "v5.6.0". That SHA is v7.0.0. The pin is the control; the comment is
        # what a reviewer reads.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_action_pins.py

  frontend:
    name: Frontend lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm test
      # local-ai-hardware-bench has audited its frontend dependencies from the
      # start; this repository ran pip-audit and nothing on the npm side, so
      # half its dependency surface was unexamined while a job named
      # "Dependency scan" was green.
      - name: npm audit (fail on high+)
        run: npm audit --audit-level=high
      - run: npm run build
      # Code splitting is invisible when it breaks: a static import of a page
      # module collapses every chunk back into the entry and nothing fails.
      - run: npm run check:bundle

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: api-verity-lab-sbom.spdx.json