name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check apiverity tests scripts
      - name: Ruff format check
        run: ruff format --check apiverity tests scripts
      - name: Type check
        run: mypy apiverity
      - name: Tests with coverage
        run: pytest tests/ -q --cov=apiverity --cov-report=term-missing --cov-fail-under=60
      - name: Build distribution
        run: python -m build
      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true   # report; strict gate tracked via Dependabot
      - name: Fixture end-to-end validation
        run: python scripts/e2e.py

  schema-validation:
    name: Result artifact schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml && pip install -e .
      - name: Validate bundled result artifacts against schemas/result-v1
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          schema = json.loads(pathlib.Path("schemas/result-v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          print("result-v1 schema is valid")
          PY

  frontend:
    name: Frontend lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          artifact-name: api-verity-lab-sbom.spdx.json